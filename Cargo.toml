[workspace]
resolver = "3"
# Every plugin is a crate under plugins/NAME; the libraries plugins
# share (the Office formats' layer) are crates under crates/NAME. The
# template is a member so that CI keeps it building.
members = ["template", "plugins/*", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkalem/plugins"
authors = ["The Kalem Contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Components are built with this profile, for speed: built for size
# (`opt-level = "s"`), the PDF viewer renders a page twelve times slower
# and is no smaller, its fonts being most of it (Kalem's D28 record). A
# plugin never unwinds across the component boundary, so panics abort.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# The image viewer's tests decode pictures of millions of pixels, which
# unoptimized take half a minute.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

# web-time without the browser's JavaScript, for the plugins built as
# WebAssembly components (cfb reads its clock): see shims/web-time.
[patch.crates-io]
web-time = { path = "shims/web-time" }
