[package]
name = "kalem-plugin-image-viewer"
description = "Pictures opened as themselves: PNG, JPEG, GIF, WebP, BMP, TIFF, ICO, QOI, TGA, PNM, DDS, OpenEXR, Radiance HDR and SVG, a JPEG turned without encoding it again"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests link the crate, and Kalem
# bundle it (D28).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The document-viewer contract (D54), from Kalem until the `kalem-plugin`
# bindings are published (T3.1.3).
kalem-viewer = { git = "https://github.com/getkalem/kalem", branch = "main" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "dds", "exr", "hdr"] }
resvg = { version = "0.45", default-features = false }
kamadak-exif = "0.6"

# The component's exports (`kalem plugin build`): the Rust contract
# adapted to the WIT world `document-viewer`, on wasm32 only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
