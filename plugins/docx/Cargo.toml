[package]
name = "kalem-plugin-docx"
description = "Word documents (WordprocessingML, ECMA-376) opened, edited and saved as themselves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests and the example link the
# crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The document-viewer contract (D54), from Kalem until the `kalem-plugin`
# bindings are published (T3.1.3).
kalem-viewer = { git = "https://github.com/getkalem/kalem", branch = "main" }
# The Office layer shared with the xlsx plugin: the package part by
# part, the span-keeping XML reader, relationships, encryption, the
# theme.
kalem-ooxml = { path = "../../crates/ooxml" }

# The component's exports (`kalem plugin build`): the Rust contract
# adapted to the WIT world `flow-viewer` (with the feature `flow`: Kalem
# lays the paragraphs out, plugin API 0.2.7), on wasm32 only; the clock
# of the compound file reader (an encrypted document) from Kalem's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main", features = ["flow"] }
web-time = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
