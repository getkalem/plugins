[package]
name = "kalem-plugin-pta"
description = "Plain text accounting for Kalem: hledger, Ledger and Beancount journals written, checked, imported, reconciled and reported"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# One plugin with two halves in one manifest (pta_todo.md): the
# declarative half names the three languages and their servers, which
# Kalem's core runs; the component (`src/component.rs`) runs the user's
# own tool, hledger, Ledger or Beancount, through `process`, and writes
# documents. The library is the component's logic, tested natively.

[lib]
# cdylib is the component; rlib lets the tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The plugin's settings, which Kalem hands over as JSON; the tools' JSON
# output in the tasks after.
serde_json = "1"

[dev-dependencies]
# The highlighter Kalem uses, to check that the syntaxes parse every
# corpus file to its end: Kalem's own leaves a line it cannot parse
# uncolored.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }
# Kalem's highlighter, to load the syntaxes as Kalem loads them (`extends`
# resolved over the journal base) and check the colors they give.
kalem-highlight = { git = "https://github.com/getkalem/kalem", rev = "dec56dcbcbbf138af17a2651833e094cf1bd3583" }
# Kalem's language server client, at the same revision, for the corpus
# test through the servers (`tests/server.rs`).
kalem-lsp = { git = "https://github.com/getkalem/kalem", rev = "dec56dcbcbbf138af17a2651833e094cf1bd3583" }

# The component: Kalem's `extension-executor` world (the feature
# `executor`, plugin API 0.2.21: its completer, its formatter, its outline
# and its Babel languages) with its `process` interface. Its manifest
# keeps `api` ^0.2.18: an earlier Kalem never asks the executor.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main", features = ["executor"] }

[lints]
workspace = true
