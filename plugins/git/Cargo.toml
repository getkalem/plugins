[package]
name = "kalem-plugin-git"
description = "Git in Kalem: the repository's status as a document, staged by file, hunk or line, on Doom's SPC g keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests and the example link the
# crate.
crate-type = ["cdylib", "rlib"]

# No dependencies of its own: the plugin parses git's porcelain output
# and builds patches itself.
[dependencies]

# The component (`src/component.rs`): Kalem's `extension` world with its
# `process` interface (plugin API 0.2.4, DESIGN.md 9.1).
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
