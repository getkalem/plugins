[package]
name = "kalem-plugin-rust"
description = "Rust for Kalem: rust-analyzer as the language server, on Kalem's own Rust highlighting"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# A language plugin is declarative (D57): a manifest and settings, read by
# Kalem's core, which runs rust-analyzer through its one client. The crate
# holds the manifest and the conformance tests; it has no component to
# build. `corpus/ws` is a Cargo workspace of its own (its own `[workspace]`
# table), not a member of this one.

[dependencies]

[dev-dependencies]
serde_json = "1"
# Kalem's highlighter, to check that the syntax the manifest names is the
# one Kalem has built in, and that it colors the corpus.
kalem-highlight = { git = "https://github.com/getkalem/kalem", rev = "dfd6c1d11a61eb76e1e11d2dbe196cbb8c32e1dd" }

[lints]
workspace = true
