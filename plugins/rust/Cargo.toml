[package]
name = "kalem-plugin-rust"
description = "Rust for Kalem: highlighting for the current editions, and rust-analyzer as the language server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# A language plugin is declarative (D57): a manifest, a syntax file and
# settings, read by Kalem's core, which runs rust-analyzer through its one
# client. The crate
# holds the manifest and the conformance tests; it has no component to
# build. `corpus/ws` is a Cargo workspace of its own (its own `[workspace]`
# table), not a member of this one.

[dependencies]

[dev-dependencies]
serde_json = "1"
# The highlighter Kalem uses, to check that the syntax parses every corpus
# file to its end: Kalem's own leaves a line it cannot parse uncolored.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }
# Kalem's highlighter, to check the syntax as Kalem loads it: registered
# over the built-in Rust, and the colors it gives the corpus.
kalem-highlight = { git = "https://github.com/getkalem/kalem", rev = "b0b8765074cbe70b237804ef80c13e262dfc2b38" }
# Kalem's language server client, at the same revision, for the corpus
# test through rust-analyzer (`tests/server.rs`).
kalem-lsp = { git = "https://github.com/getkalem/kalem", rev = "b0b8765074cbe70b237804ef80c13e262dfc2b38" }

[lints]
workspace = true
