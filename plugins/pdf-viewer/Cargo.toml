[package]
name = "kalem-plugin-pdf-viewer"
description = "PDF opened as itself: pages rendered by hayro, a text layer for search, copy and the terminal, the outline, page labels and links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests link the crate, and Kalem
# bundle it (D28).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The document-viewer contract (D54), from Kalem until the `kalem-plugin`
# bindings are published (T3.1.3).
kalem-viewer = { git = "https://github.com/getkalem/kalem", branch = "main" }
# The rasterizer (D56). Its default features embed the base-14 fonts'
# substitutes (Foxit's CFF fonts) and the predefined CMaps, so a file that
# does not embed its fonts draws inside the sandbox too.
hayro = "0.7"
kurbo = "0.13"

# The component's exports (`kalem plugin build`): the Rust contract
# adapted to the WIT world `document-viewer`, on wasm32 only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
