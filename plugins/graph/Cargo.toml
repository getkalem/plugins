[package]
name = "kalem-plugin-graph"
description = "Logseq graphs and Obsidian vaults opened as themselves: pages, journals, backlinks, block references, tags, tasks and queries, edited as an outliner"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Obsidian's three settings files (`.obsidian/daily-notes.json`,
# `app.json`, `templates.json`), read read-only.
serde_json = "1"

# The component (`src/component.rs`): Kalem's `extension` world with its
# `fs`, `documents`, `ui`, `editor` and `clock` interfaces, and the
# `layer`, `completer` and `layer-2` it exports (plugin API 0.2.13,
# `kalem-plugin`'s feature `layer-2`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main", features = ["layer-2"] }

[lints]
workspace = true
