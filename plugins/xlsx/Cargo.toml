[package]
name = "kalem-plugin-xlsx"
description = "Excel workbooks (SpreadsheetML, ECMA-376) opened, edited and saved as themselves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib is the component; rlib lets the tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The document-viewer contract (D54), from Kalem until the `kalem-plugin`
# bindings are published (T3.1.3).
kalem-viewer = { git = "https://github.com/getkalem/kalem", branch = "main" }
# The Office layer shared with the docx plugin: the package, the XML
# reader, relationships, encryption, the theme.
kalem-ooxml = { path = "../../crates/ooxml" }
# The VBA project's compound file.
cfb = "0.15.0"
crc32fast = "1.5.2"
# IronCalc in getkalem's fork: on wasm32 it runs without JavaScript, its
# clock and randomness from Kalem's `clock` interface (feature `host`).
ironcalc_base = { git = "https://github.com/getkalem/ironcalc", branch = "kalem", default-features = false }
miniz_oxide = "0.9.1"
# Sheet and workbook protection's password hashes, as Excel writes them.
sha2 = "0.11"

# `.xls`, `.xlsb` and `.ods` (shown only), in the component too: it
# builds for wasm32-unknown-unknown and imports nothing.
calamine = "0.36.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The system's time zone, for NOW() and TODAY() as Excel gives them (the
# component asks Kalem's clock).
iana-time-zone = "0.1"

# The component's exports (`kalem plugin build`): the Rust contract
# adapted to the WIT world `spreadsheet-viewer` (the grid's half, with the
# feature `grid`), and the engine's clock from Kalem's, on wasm32 only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kalem-plugin = { git = "https://github.com/getkalem/kalem", branch = "main", features = ["grid"] }
ironcalc_base = { git = "https://github.com/getkalem/ironcalc", branch = "kalem", default-features = false, features = ["host"] }
web-time = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
