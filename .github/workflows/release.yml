# Publishes one plugin: push a tag NAME-vX.Y.Z, where NAME is the directory
# under plugins/ and X.Y.Z the version in its plugin.json. A component is
# built from the tagged source; a declarative plugin (no `main`: a manifest
# and syntax files) is packed as NAME-vX.Y.Z.tar.gz of its folder, as
# tools/build-index.py names it. The asset is hashed, signed with sigstore
# through the workflow's identity, and attached to a GitHub release; then
# main gets the SHA-256 file and a regenerated index.json.
name: Release a plugin

on:
  push:
    tags: ["*-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin name and version from the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          test -f "plugins/$name/plugin.json" || { echo "no plugins/$name/plugin.json"; exit 1; }
          manifest_version=$(python3 -c "import json;print(json.load(open('plugins/$name/plugin.json'))['version'])")
          test "$manifest_version" = "$version" || { echo "tag says $version, plugin.json says $manifest_version"; exit 1; }
          main=$(python3 -c "import json;print(json.load(open('plugins/$name/plugin.json')).get('main', ''))")
          if [ -n "$main" ]; then
            asset=$(basename "$main")
            kind=component
          else
            asset="$tag.tar.gz"
            kind=declarative
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tag.outputs.kind == 'component'
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        if: steps.tag.outputs.kind == 'component'
        with:
          tool: wasm-tools
      - name: Build the component from the tagged source
        if: steps.tag.outputs.kind == 'component'
        run: |
          name="${{ steps.tag.outputs.name }}"
          # As Kalem builds its own: WebAssembly's SIMD (a PDF page in 39
          # ms with it, 52 without), and the functions' names kept, so a
          # trap in Kalem's log is a backtrace of them.
          cargo build --release --target wasm32-unknown-unknown -p "kalem-plugin-$name" \
            --config 'target.wasm32-unknown-unknown.rustflags=["-C", "target-feature=+simd128"]' \
            --config 'profile.release.strip="debuginfo"'
          mkdir -p dist
          # This plugin's module, not the first one of the folder.
          built="target/wasm32-unknown-unknown/release/kalem_plugin_${name//-/_}.wasm"
          wasm-tools component new "$built" -o "dist/${{ steps.tag.outputs.asset }}"
          (cd dist && sha256sum "${{ steps.tag.outputs.asset }}" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Pack the declarative plugin's folder from the tagged source
        if: steps.tag.outputs.kind == 'declarative'
        run: |
          mkdir -p dist
          # The folder's files at the archive's root, as Kalem unpacks it.
          git archive --format=tar.gz -o "dist/${{ steps.tag.outputs.asset }}" "HEAD:plugins/${{ steps.tag.outputs.name }}"
          (cd dist && sha256sum "${{ steps.tag.outputs.asset }}" > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign the asset (sigstore, keyless)
        run: |
          cd dist
          cosign sign-blob --yes "${{ steps.tag.outputs.asset }}" \
            --bundle "${{ steps.tag.outputs.asset }}.sigstore.json"
      - name: GitHub release with the asset, its hash and its signature
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/${{ steps.tag.outputs.asset }}
            dist/SHA256SUMS
            dist/${{ steps.tag.outputs.asset }}.sigstore.json
      - name: Record the hash on main and regenerate the index
        run: |
          sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          git fetch origin main
          git checkout main
          echo "$sha  ${{ steps.tag.outputs.asset }}" > "releases/${{ github.ref_name }}.sha256"
          python3 tools/build-index.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases index.json
          git commit -m "Publish ${{ github.ref_name }}"
          git push origin main
