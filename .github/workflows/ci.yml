name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  components:
    name: build every component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      # Built for wasm32-unknown-unknown and wrapped, a component imports
      # only what its WIT world names, as `kalem plugin build` makes it;
      # built for wasm32-wasip2 it would import WASI, which Kalem does not
      # grant (Kalem's D28 record).
      - run: cargo build --release --workspace --target wasm32-unknown-unknown
      - name: Wrap the modules as components; none may import WASI
        run: |
          for m in target/wasm32-unknown-unknown/release/*.wasm; do
            case "$m" in *.component.wasm) continue ;; esac
            c="${m%.wasm}.component.wasm"
            # A module that imports what no component may (wasm-bindgen's
            # JavaScript glue, pulled in by a dependency that assumes
            # wasm32 means a browser) cannot be wrapped yet: said, not
            # failed, until the plugin is a component (Kalem's T3.1.3).
            if ! err=$(wasm-tools component new "$m" -o "$c" 2>&1); then
              echo "::warning title=not a component yet::$m: $(echo "$err" | grep -m1 'import interface')"
              continue
            fi
            if wasm-tools component wit "$c" | grep -q 'import wasi:'; then
              echo "$c imports WASI:"; wasm-tools component wit "$c" | grep 'import '; exit 1
            fi
          done
          ls -la target/wasm32-unknown-unknown/release/*.component.wasm

  hygiene:
    name: no committed components, index current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No compiled component is committed
        run: "! git ls-files | grep -E '\\.wasm$'"
      - name: index.json matches the manifests
        run: python3 tools/build-index.py --check
