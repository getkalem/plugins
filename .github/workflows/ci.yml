name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The rust plugin's corpus test (plugins/rust/tests/server.rs)
          # speaks to rust-analyzer, whose formatting runs rustfmt and is
          # compared with rustfmt's own.
          components: rust-analyzer, rustfmt
      - uses: Swatinem/rust-cache@v2
      # rustup puts a rust-analyzer on the PATH with or without the
      # component, and only running it tells; the corpus test, finding none
      # that runs, skips and passes, so a missing one fails here instead.
      - name: rust-analyzer runs
        run: rust-analyzer --version
      - run: cargo test --workspace

  components:
    name: build every component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      # Built for wasm32-unknown-unknown and wrapped, a component imports
      # only what its WIT world names, as `kalem plugin build` makes it;
      # built for wasm32-wasip2 it would import WASI, which Kalem does not
      # grant (Kalem's D28 record).
      - run: cargo build --release --workspace --target wasm32-unknown-unknown
      - name: Wrap the modules as components; none may import WASI
        run: |
          for m in target/wasm32-unknown-unknown/release/*.wasm; do
            case "$m" in *.component.wasm) continue ;; esac
            c="${m%.wasm}.component.wasm"
            # Every plugin is a component: a module importing what none may
            # (wasm-bindgen's JavaScript glue, from a dependency assuming
            # wasm32 means a browser) fails.
            wasm-tools component new "$m" -o "$c"
            if wasm-tools component wit "$c" | grep -q 'import wasi:'; then
              echo "$c imports WASI:"; wasm-tools component wit "$c" | grep 'import '; exit 1
            fi
          done
          ls -la target/wasm32-unknown-unknown/release/*.component.wasm

  hygiene:
    name: no committed components, index current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No compiled component is committed
        run: "! git ls-files | grep -E '\\.wasm$'"
      - name: index.json matches the manifests
        run: python3 tools/build-index.py --check
